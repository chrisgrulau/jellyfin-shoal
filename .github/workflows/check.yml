name: Check

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so a new plugin release that isn't in the manifest yet shows up as a failing check
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check manifest.json matches the verified releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/update_manifest.py --check
